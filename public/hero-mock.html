<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; box-sizing:border-box; }
  body { background:#07050c; font-family:ui-monospace,monospace; }
  .panel { position:relative; width:100%; height:358px; overflow:hidden; border-bottom:1px solid rgba(151,139,173,.3); }
  .bg { position:absolute; inset:0; background:url('/brand/bg-greenpurple-star.jpg') center/cover; opacity:.7; }
  .shade { position:absolute; inset:0; background:linear-gradient(to bottom, rgba(7,5,12,.5), rgba(7,5,12,.25) 50%, #07050c); }
  .tag { position:absolute; top:12px; left:18px; z-index:5; font-size:11px; letter-spacing:.18em; color:#fbbf24; }
  .copy { position:absolute; left:24px; bottom:34px; z-index:4; max-width:55%; }
  .kicker { font-size:10px; letter-spacing:.2em; color:#a78bfa; }
  h1 { font-family:Arial Black, Arial, sans-serif; color:#efecf7; font-size:23px; line-height:1.12; margin-top:9px; }
  .line { margin-top:10px; font-family:Arial, sans-serif; font-size:14px; color:rgba(239,236,247,.85); }
  .line em { color:#a78bfa; font-style:normal; }
  .star1 { position:absolute; top:34px; right:34px; width:150px; z-index:3;
    filter: drop-shadow(0 0 20px rgba(167,139,250,.9)) drop-shadow(0 0 54px rgba(109,40,217,.6)); }
  .glyph { position:absolute; top:22px; right:26px; z-index:3; }
</style></head><body>

<div class="panel">
  <div class="bg"></div><div class="shade"></div>
  <div class="tag">OPTION 1 · THE DRAWN STAR</div>
  <img class="star1" src="/brand/star-smeared.png">
  <div class="copy">
    <div class="kicker">✦ THE VISION</div>
    <h1>Create Content Missionaries Worldwide</h1>
    <div class="line">A missionary to <em>gaming</em> niche.</div>
  </div>
</div>

<div class="panel">
  <div class="bg"></div><div class="shade"></div>
  <div class="tag">OPTION 2 · SELF-DRAWING GLYPH</div>
  <svg class="glyph" width="190" height="190" viewBox="0 0 260 260">
    <defs><filter id="g"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <circle cx="130" cy="130" r="104" fill="none" stroke="rgba(151,139,173,.35)" stroke-width="1" stroke-dasharray="3 7"/>
    <circle cx="130" cy="130" r="58" fill="none" stroke="rgba(151,139,173,.22)" stroke-width="1" stroke-dasharray="2 6"/>
    <line x1="130" y1="10" x2="130" y2="250" stroke="rgba(151,139,173,.2)" stroke-width="1" stroke-dasharray="2 8"/>
    <line x1="10" y1="130" x2="250" y2="130" stroke="rgba(151,139,173,.2)" stroke-width="1" stroke-dasharray="2 8"/>
    <path d="M130 22 C138 88 168 112 238 130 C168 148 138 172 130 238 C122 172 92 148 22 130" fill="none" stroke="#efecf7" stroke-width="2.6" filter="url(#g)" stroke-linecap="round"/>
    <path d="M22 130 C92 112 122 88 130 22" fill="none" stroke="rgba(196,181,253,.8)" stroke-width="2.2" stroke-dasharray="8 9" stroke-linecap="round" filter="url(#g)"/>
    <circle cx="53" cy="115" r="4.5" fill="#efecf7" filter="url(#g)"/>
  </svg>
  <div class="copy">
    <div class="kicker">✦ THE VISION</div>
    <h1>Create Content Missionaries Worldwide</h1>
    <div class="line">A missionary to <em>food</em> niche.</div>
  </div>
</div>

</body></html>
